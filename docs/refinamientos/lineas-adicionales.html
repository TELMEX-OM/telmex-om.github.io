<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squad OM | Refinamiento Líneas Adicionales</title>
  <link rel="stylesheet" href="../../assets/css/refinamiento.css?v=20261126">
</head>
<body>
  <header>
    <div class="squad-bar">
      <img src="../../assets/img/salesforce-logo.webp" alt="Salesforce">
      <strong>Squad OM</strong>
      <a href="../../#sprint-3">&larr; Volver a Sprint 3</a>
    </div>
    <h1>Refinamiento Líneas Adicionales</h1>
    <p>Alta de líneas telefónicas extra · Notas de la sesión</p>
  </header>
  <main>
    <div class="ref-toolbar">
      <button class="ref-btn" id="ref-time" title="Inserta la hora actual en una línea nueva">+ Hora</button>
      <button class="ref-btn" id="ref-bullet" title="Inserta una viñeta en una línea nueva">+ Viñeta</button>
      <span class="spacer"></span>
      <input class="ref-key" id="ref-key" type="password" placeholder="Clave del equipo" autocomplete="off">
      <button class="ref-btn" id="ref-copy">Copiar todo</button>
      <button class="ref-btn" id="ref-download">Descargar .txt</button>
      <button class="ref-btn" id="ref-focus">Pantalla completa</button>
    </div>
    <textarea id="ref-notes" data-id="lineas-adicionales" data-title="Refinamiento Líneas Adicionales" spellcheck="true"
      placeholder="Escribe aquí lo que vaya saliendo en la sesión: acuerdos, dudas, pendientes, quién dijo qué…&#10;&#10;Se guarda solo mientras escribes."></textarea>
    <div class="ref-foot">
      <span class="ref-status" id="ref-status"></span>
      <span id="ref-count"></span>
    </div>
  </main>
  <script src="../../assets/data/notas-config.js?v=20261126"></script>
  <script src="../../assets/js/refinamiento.js?v=20261126"></script>
</body>
</html>
